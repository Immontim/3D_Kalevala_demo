<!doctype html>
<html lang="fi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="mapRoot" class="hidden"></div>
    <canvas id="c"></canvas>
    <div id="vignette"></div>
    <div id="flash"></div>

    <div id="hud">
      <div class="bars">
        <div class="bar-wrap" id="meterPlayer">
          <div class="label" data-i18n="hud.you"></div>
          <div class="bar"><div id="php" class="fill hp"></div><span class="num" id="phpNum"></span></div>
          <div class="bar stamina"><div id="psta" class="fill stamina"></div><span class="num" id="pstaNum"></span></div>
          <div class="bar thin shieldbar"><div id="pshield" class="fill shield"></div></div>
          <div class="label small"><span data-i18n="hud.songPower"></span> <span id="songReady"></span></div>
          <div class="bar thin"><div id="psong" class="fill song"></div></div>
          <div class="label small" id="pstance"></div>
        </div>
        <div class="bar-wrap right" id="meterEnemy">
          <div class="label" id="ename"></div>
          <div class="bar"><div id="ehp" class="fill hp enemy"></div><span class="num" id="ehpNum"></span></div>
          <div class="bar stamina"><div id="esta" class="fill stamina"></div><span class="num" id="estaNum"></span></div>
          <div class="bar thin shieldbar"><div id="eshield" class="fill shield"></div></div>
          <div class="label small" id="wave"></div>
          <div class="label cue" id="cue"></div>
        </div>
      </div>
      <div id="charge"><div id="chargeLabel"></div><div class="bar"><div id="chargeFill" class="fill charge"></div></div></div>
      <div id="foeBars"></div>
      <div id="lockMark" class="hidden">◆</div>
      <div id="rearWarn" class="hidden"><span>▲</span></div>
      <div id="gazeFocus" class="hidden" aria-hidden="true">
        <span id="gazeDot"></span>
        <span id="gazePrompt"></span>
      </div>
      <div id="dialogue" class="hidden" role="dialog" aria-live="polite">
        <div id="dialogueName"></div>
        <p id="dialogueText"></p>
        <div id="dialogueChoices"></div>
        <div id="dialogueHint" data-i18n="dialogue.hint"></div>
      </div>
      <div id="msg"></div>
      <div id="sub"></div>
      <div id="corner"><span id="tuned"></span><span id="ver"></span> · <span id="fps"></span> <span data-i18n="hud.fps"></span></div>
    </div>

    <div id="freecamHint" class="hidden" data-i18n-html="freecam.hint"></div>

    <div id="choice" class="hidden">
      <div id="choiceHint"></div>
    </div>

    <div id="song" class="hidden">
      <div id="verse" lang="fi" translate="no" class="notranslate"></div>
      <div id="track"><div id="marker"></div></div>
      <div id="songHint" data-i18n="song.rhythmHint"></div>
    </div>

    <div id="touch" class="hidden">
      <button data-act="dodge" data-i18n="touch.dodge"></button>
      <button data-act="song" data-i18n="touch.song"></button>
      <button data-act="block" data-i18n="touch.block"></button>
      <button data-act="attack" class="big" data-i18n="touch.attack"></button>
    </div>

    <div id="pause" class="overlay hidden">
      <div class="panel">
        <h1 data-i18n="pause.title"></h1>
        <p class="tag" data-i18n="pause.subtitle"></p>
        <button id="freeCamBtn" class="secondary first" data-i18n="pause.freeCam"></button>
        <p class="small" data-i18n="pause.freeCamHelp"></p>
        <div class="tabs">
          <button id="tabBinds" class="tab on" data-i18n="pause.bindings"></button>
          <button id="tabTune" class="tab" data-i18n="pause.tuning"></button>
          <button id="tabInventory" class="tab" data-i18n="pause.inventory"></button>
        </div>
        <div id="paneBinds" class="pane">
          <div id="binds"></div>
          <p class="small" id="bindNote"></p>
          <p class="small" data-i18n="pause.fixedBindings"></p>
          <button id="resetBinds" class="secondary first" data-i18n="pause.resetBindings"></button>
          <p class="small" data-i18n="pause.meters"></p>
          <button id="resetMeters" class="secondary first" data-i18n="pause.resetMeters"></button>
        </div>
        <div id="paneTune" class="pane hidden">
          <p class="small" data-i18n="pause.tuningIntro"></p>
          <div id="tuneFields"></div>
          <h2 data-i18n="pause.valuesAsText"></h2>
          <p class="small" data-i18n="pause.valuesHelp"></p>
          <textarea id="tuneJson" spellcheck="false"></textarea>
          <p class="small" id="tuneNote"></p>
          <div class="tunebtns">
            <button id="tuneApply" data-i18n="pause.apply"></button>
            <button id="tuneCopy" class="secondary" data-i18n="pause.copy"></button>
            <button id="tuneReset" class="secondary" data-i18n="pause.reset"></button>
          </div>
        </div>
        <div id="paneInventory" class="pane hidden">
          <p class="small" data-i18n="pause.inventoryHelp"></p>
          <div id="pauseInventory"></div>
        </div>
        <button id="resumeBtn" data-i18n="pause.resume"></button>
        <button id="menuBtn" class="secondary" data-i18n="pause.menu"></button>
      </div>
    </div>

    <div id="start" class="overlay">
      <div class="panel">
        <div id="languagePick" class="language-pick" role="group" aria-labelledby="languageLabel">
          <span id="languageLabel" class="language-label" data-i18n="language.label"></span>
          <button type="button" data-language="fi"><span class="flag-icon flag-fi" aria-hidden="true"></span><span>FI</span></button>
          <button type="button" data-language="en"><span class="flag-icon flag-en" aria-hidden="true"><span class="flag-uk"></span><span class="flag-us"><i></i></span></span><span>EN</span></button>
        </div>
        <h1 data-i18n="meta.title"></h1>
        <p class="tag" data-i18n="start.subtitle"></p>
        <h2 data-i18n="start.arena"></h2>
        <div id="arenaPick"></div>
        <p class="small" id="arenaNote" data-i18n="start.arenaNote"></p>
        <h2 data-i18n="start.loadout"></h2>
        <div id="gearPick"></div>
        <h2 data-i18n="start.controls"></h2>
        <ul>
          <li data-i18n-html="start.help.look"></li>
          <li data-i18n-html="start.help.lock"></li>
          <li data-i18n-html="start.help.arc"></li>
          <li data-i18n-html="start.help.slash"></li>
          <li data-i18n-html="start.help.strikes"></li>
          <li data-i18n-html="start.help.heavy"></li>
          <li data-i18n-html="start.help.block"></li>
          <li data-i18n-html="start.help.shield"></li>
          <li data-i18n-html="start.help.weaponBlock"></li>
          <li data-i18n-html="start.help.stamina"></li>
          <li data-i18n-html="start.help.dodge"></li>
          <li data-i18n-html="start.help.peace"></li>
          <li data-i18n-html="start.help.song"></li>
          <li data-i18n-html="start.help.pause"></li>
        </ul>
        <p class="small" data-i18n="start.help.footer"></p>
        <button id="startBtn" data-i18n="start.begin"></button>
        <details id="credits" class="small">
          <summary data-i18n="credits.title"></summary>
          <p data-i18n-html="credits.intro"></p>
          <ul>
            <li><a href="https://sketchfab.com/3d-models/animated-dog-shiba-inu-9abfce885a834399b2c3ccaed51cd474" target="_blank" rel="noopener" data-i18n="credits.dog"></a></li>
            <li><a href="https://sketchfab.com/3d-models/halva-the-chicken-ab37ae9021dc4aa29c4cee9778646470" target="_blank" rel="noopener" data-i18n="credits.hen"></a></li>
            <li><a href="https://sketchfab.com/3d-models/piglet-8343f141936f4c799ed980a3c7c3ae27" target="_blank" rel="noopener" data-i18n="credits.pig"></a></li>
            <li><a href="https://sketchfab.com/3d-models/handpainted-rooster-and-hen-34b79d3f8adb43c583d08babf3ef6dc0" target="_blank" rel="noopener" data-i18n="credits.fowl"></a></li>
          </ul>
          <p data-i18n="credits.cc0"></p>
        </details>
      </div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
